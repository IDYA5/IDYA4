<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDYA4 - Redesign in Progress</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="container">
        <!-- Logo Header -->
        <div class="logo-wrapper">
            <img src="logo.png" alt="IDYA4 Logo" class="logo">
        </div>

        <!-- Main Content -->
        <div class="content">
            <span class="badge">Under Construction</span>
            <h1>Re-Designing in Progress</h1>
            <p>We are currently upgrading our website to bring you a better digital experience. Please check back soon!</p>
            
            <!-- Contact Button -->
            <div class="cta-group">
                <a href="mailto:info@idya4.com" class="btn btn-primary">Contact Us</a>
            </div>
        </div>

        <!-- Footer -->
        <footer>
            <p>&copy; <span id="year"></span> IDYA4. All rights reserved.</p>
        </footer>
    </main>

    <script>
        // Dynamically update footer year
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
