<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Abstract city and landscape illustration</title>
  <desc id="desc">A subtle blue and orange skyline used as a decorative background.</desc>
  <defs>
